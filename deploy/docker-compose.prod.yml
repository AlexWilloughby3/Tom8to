services:
  web:
    image: ${REGISTRY}/web:${TAG}
    container_name: tom8to_web
    restart: unless-stopped
    # No published ports: the only way in is the Cloudflare Tunnel below, which
    # reaches this container over the `edge` network.
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - default
      - edge
    depends_on:
      - api
    deploy:
      resources:
        limits:
          memory: 256m

  # Dials out to Cloudflare and carries all public traffic back in, so the VM
  # needs no inbound 80/443. Hostname -> service routing lives in the Cloudflare
  # dashboard (tomato.alex-ware.com -> http://tom8to_web:80). Other apps on this
  # VM join the `edge` network as external and get their own hostname there.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    networks:
      - edge
    depends_on:
      - web
    deploy:
      resources:
        limits:
          memory: 128m

  api:
    image: ${REGISTRY}/api:${TAG}
    container_name: tom8to_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  db:
    image: postgres:16-alpine
    container_name: tom8to_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768m

networks:
  edge:
    name: edge

volumes:
  caddy_data:
  caddy_config:
  pgdata:
