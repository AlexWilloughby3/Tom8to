name: Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys landing on the VM at once would interleave their `docker compose
# up` and their edits to the same .env TAG line. Queue them instead, and don't
# cancel a half-finished deploy partway through.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend build (includes tsc)
        working-directory: frontend
        run: npm run build

      - name: Frontend tests (not blocking yet)
        working-directory: frontend
        continue-on-error: true
        run: npx vitest run

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend install
        working-directory: backend
        run: |
          pip install -r requirements.txt
          # pytest/httpx are test-only — kept out of requirements.txt so the
          # prod image (built from that file) doesn't carry them.
          # httpx 0.28 dropped the `app=` shortcut that this version of
          # starlette's TestClient passes, so every test errors on setup.
          pip install pytest 'httpx<0.28'

      - name: Backend timezone tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: pytest app/test_timezone_splitting.py

      - name: Backend api tests (not blocking yet)
        working-directory: backend
        continue-on-error: true
        env:
          DATABASE_URL: sqlite:///./ci.db
        run: pytest test_api.py

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A wedged IAP tunnel otherwise hangs for the 6-hour default.
    timeout-minutes: 20
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/tom8to/api:${{ github.sha }}
          # Both builds default to the same gha cache scope and would keep
          # evicting each other's layers, so give each image its own.
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/tom8to/web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Copy deploy files to VM
        run: |
          gcloud compute scp \
            deploy/docker-compose.prod.yml deploy/deploy.sh \
            tom8tovm:/tmp/ \
            --zone=${{ vars.GCP_ZONE }} \
            --tunnel-through-iap \
            --ssh-key-expire-after=30m

      - name: Run deploy.sh on the VM
        run: |
          gcloud compute ssh tom8tovm \
            --zone=${{ vars.GCP_ZONE }} \
            --tunnel-through-iap \
            --ssh-key-expire-after=30m \
            --command="sudo bash /tmp/deploy.sh ${{ github.sha }}"
